name: pi-box

services:
  pi-box:
    image: ${IMAGE:-pi-box:0.2.0}
    build:
      context: .
      target: recommended
      args:
        PI_BOX_UID: ${PI_BOX_UID:-1000}
        PI_BOX_GID: ${PI_BOX_GID:-1000}
    container_name: ${CONTAINER:-pi-box-main-container}
    # Apps use 0.0.0.0:5173–5182 inside Pi; never expose them to the LAN.
    ports:
      - "127.0.0.1:${DEV_PORTS:-5173-5182}:5173-5182"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # A host path binds a directory; the default is the named volume below.
      - ${WORKSPACE_DIR:-workspace}:/workspace
      - ${STATE_DIR:-${HOME}/pi-box-data/state}:/state
    healthcheck:
      test: ["CMD", "tmux", "has-session", "-t", "=shell"]
      # Poll every second while starting; --wait returns on the first success.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

# Explicit names reuse the existing storage rather than project-prefixed volumes.
volumes:
  workspace:
    name: ${WORKSPACE_VOLUME:-pi-box-workspace}
